name = "lazyanalytics"
main = "src/index.ts"
compatibility_date = "2026-03-01"

# No account_id here on purpose: pass it via the CLOUDFLARE_ACCOUNT_ID
# environment variable when running wrangler (the setup flow does this).

[vars]
# Comma-separated list of sites to track
ALLOWED_SITES = "example.com"
TRACK_AI_CRAWLERS = "false"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "agent_analytics"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "lazyanalytics-archive"

# 06:00 UTC = 07:00 London during BST (06:00 London in winter; CF crons are UTC-only)
[triggers]
crons = ["0 6 * * *"]

# Workers Logs: retain console.* output per invocation (incl. cron runs).
[observability]
enabled = true
head_sampling_rate = 1
